services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: demo-backend
    ports:
      - "8000:8000"
  nginx:
    image: nginx:latest
    container_name: demo-nginx
    ports:
      - "8001:80"
    volumes:
      - ./frontend/option_price_calculator/docker/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/option_price_calculator/docker/html:/usr/share/nginx/html
    depends_on:
      - backend
